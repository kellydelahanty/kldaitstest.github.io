<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="css/style.css">
    <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="../css/sandbox.css" />

    
</head>

<body>
    <aside class="sb-header">
        <div>
          <h1>Kelly Delahanty's Front-End Sandbox</h1>
          <nav>
            <a href="../../index.html">Back to Sandbox Home</a>
          </nav>
        </div>
      </aside>

    <main id="main">
        <h1>Tooltip Testing</h1>
        <div class="cell">    
            <button class="js-tooltip"
            data-tooltip-content-id="no-prefix"
            data-tooltip-title="No Prefix"
            data-tooltip-close-text="Close it"
            data-tooltip-close-title="Close it, really">
            No prefix tooltip
             </button>
            <div id="no-prefix" class="hidden">Woot, you can take the content of a hidden <code>div</code>.</div>
        </div>

        <div class="cell">
            <button class="js-tooltip"
            data-tooltip-content-id="simple-demo-example"
            data-tooltip-prefix-class="simple-tooltip"
            data-tooltip-title="Demo Standard Simple Tooltip"
            data-tooltip-close-text="Close it"
            data-tooltip-close-title="Close it, really">
             Demo Standard Simple Tooltip
           </button>
           <div id="simple-demo-example" class="hidden">Woot, you can take the content of a hidden <code>div</code>.</div>
    
        </div>


        <div class="cell">    
            <button class="js-tooltip"
            data-tooltip-content-id="wip-test-tooltip"
            data-tooltip-prefix-class="wip-tooltip"
            data-tooltip-title="WIP Test Tooltip Styling"
            data-tooltip-close-text="Close it"
            data-tooltip-close-title="Close it, really">
                WIP Test Tooltip Styling
            </button>
            <div id="wip-test-tooltip" class="hidden">Woot, you can take the content of a hidden <code>div</code>.</div>
        </div>


 


    </main>


    <script src="js/jquery-accessible-dialog-tooltip-aria.js"></script>
</body>

</html>
