<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta charset="utf-8" />
    <title>Textarea character counter (from Jeff)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" type="text/css" href="../css/sandbox.css" />

    <style>
        /* =========== DEV HELP =========== */
        .hide {
            display: none !important;
        }

        label {
            font-weight: bold;
            display: block;
        }

        .quest {
            margin: 2rem 1rem;
        }

        /* =========== Page Styling =========== */
    </style>
</head>

<body class="sb-body">
    <aside class="sb-heading">
        <div>
            <h1>Kelly Delahanty's Front-End Sandbox</h1>
            <nav>
                <a href="../../index.html">Back to Sandbox Home</a>
            </nav>
        </div>
    </aside>

    <main class="sb-main">
        <h1>Character Counter (from Jeff) </h1>
        <form>

            <!--Max Character Counter-->
            <div class="quest ">
                <label for="maxTextarea">Character Counter with MAX character limit:</label>
                <textarea id="maxTextarea" rows="2" cols="40" maxlength="25"></textarea>
                <div id="maxCharCount">0 / 25 characters</div>
            </div>

            <!--min length with character counter-->
            <div class="quest ">
                <label for="minTextarea">Character Counter with MIN character limit:</label>
                <textarea id="minTextarea" rows="2" cols="40" minlength="25"></textarea>
                <div id="minCharCount">Characters: 0 (Minimum 25 characters)</div>
            </div>
        </form>

    </main>


    <!--Max Character Counter-->
    <script>
        const maxTextarea = document.getElementById('maxTextarea');
        const maxCharCount = document.getElementById('maxCharCount');
        const maxLength = maxTextarea.getAttribute('maxlength'); // Get the maxlength from HTML

        maxTextarea.addEventListener('input', function () {
            const currentLength = this.value.length;
            maxCharCount.textContent = `${currentLength} / ${maxLength} characters`;

            // Optional: Add visual feedback for exceeding limit
            if (currentLength == maxLength) {
                maxCharCount.style.color = 'red';
            } else {
                maxCharCount.style.color = 'initial'; // Reset color
            }
        });

        // Initialize the counter on page load
        maxTextarea.dispatchEvent(new Event('input'));
    </script>


    <!--Min Character Counter-->
    <script>
        const minTextarea = document.getElementById('minTextarea');
        const minCharCount = document.getElementById('minCharCount');
        const minLength = minTextarea.getAttribute('minlength'); // Get the maxlength from HTML

        minTextarea.addEventListener('input', function () {
            const currentLength = this.value.length;
            minCharCount.textContent = `Characters: ${currentLength} (Minimum 25 characters)`;

            // Optional: Add visual feedback for exceeding limit
            if (currentLength < minLength) {
                minCharCount.style.color = 'red';
            } else {
                minCharCount.style.color = 'initial'; // Reset color
            }
        });

        // Initialize the counter on page load
        minTextarea.dispatchEvent(new Event('input'));
    </script>
</body>

</html>
